name: PlannerTest
options:
  bundleIdPrefix: com.plannertest
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PlannerTest:
    type: application
    platform: iOS
    sources: [PlannerTest]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plannertest.draft
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Planner Test
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
